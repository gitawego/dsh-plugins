packages:
  - "packages/*"
# Build-script approvals (pnpm 12). Packages listed here may run their
# postinstall during `pnpm install`; everything else is ignored, and pnpm will
# NOT fail on ignored scripts once the approved set is complete. As new packages
# bring native deps (esbuild, rollup, platform binaries of either), add them here
# rather than pinning in individual package.json files.
allowBuilds:
  esbuild: true
  "@esbuild/linux-arm64": true
  "@esbuild/android-arm64": true
  rollup: true
  "@rollup/rollup-android-arm64": true
  # Transitive deps of pi-ai's provider SDKs. Their postinstall scripts are not
  # needed at runtime here (this plugin uses the OpenAI-completions and
  # Anthropic-messages protocols), so they are explicitly DENIED rather than
  # left unlisted: an unlisted pair makes pnpm 12 fail with
  # ERR_PNPM_IGNORED_BUILDS instead of finishing the install.
  '@google/genai': false
  protobufjs: false
minimumReleaseAgeExclude:
  # Pre-approvals for the supply-chain release-age gate, one entry per
  # @deepseek-ai package this workspace actually resolves. Regenerate after a
  # host upgrade: `pnpm install --lockfile-only` then update these to the
  # versions in pnpm-lock.yaml. Without an entry a freshly published version
  # cannot be locked on a machine whose minimumReleaseAge window has not
  # elapsed yet.
  - '@deepseek-ai/cordis@4.0.4'
  - '@deepseek-ai/cosmokit@1.8.5'
  - '@deepseek-ai/dsh-agent@0.1.5-rc.1'
  - '@deepseek-ai/dsh-attachment@0.1.5-rc.1 || 0.1.5-rc.3'
  - '@deepseek-ai/dsh-brand@0.1.5-rc.3'
  - '@deepseek-ai/dsh-client-connection@0.1.5-rc.1'
  - '@deepseek-ai/dsh-client-locale@0.1.5-rc.1'
  - '@deepseek-ai/dsh-client-store@0.1.5-rc.1'
  - '@deepseek-ai/dsh-client-ui-chat@0.1.5-rc.1'
  - '@deepseek-ai/dsh-client-ui-conversation@0.1.5-rc.1'
  - '@deepseek-ai/dsh-client-ui-renderer@0.1.5-rc.1'
  - '@deepseek-ai/dsh-client-ui-settings@0.1.5-rc.1'
  - '@deepseek-ai/dsh-client-ui-slots@0.1.5-rc.1'
  - '@deepseek-ai/dsh-client-ui-tool@0.1.5-rc.1'
  - '@deepseek-ai/dsh-code-runtime@0.1.5-rc.3'
  - '@deepseek-ai/dsh-commands@0.1.5-rc.1'
  - '@deepseek-ai/dsh-credentials@0.1.5-rc.1'
  - '@deepseek-ai/dsh-invariants@0.1.5-rc.3'
  - '@deepseek-ai/dsh-llm@0.1.5-rc.1'
