# Monorepo CI: typecheck + build + test for every package in packages/*.
# Uses Bun (the workspace package manager) with a cache on the lockfile.
name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Bun (reads the root packageManager field)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run --filter '*' typecheck

      - name: Build
        run: bun run --filter '*' build

      - name: Test
        run: bun run --filter '*' test
