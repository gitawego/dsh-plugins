# Monorepo release: publishes every package in packages/* to npm on a v* tag
# via OIDC TRUSTED PUBLISHING (no NPM_TOKEN).
#
# FUTURE-PROOF CONTRACT (add packages freely):
#   - The publish loop globs packages/*/ automatically, so a new package
#     needs ZERO changes to this workflow. It just needs a publishable name
#     (@gitawego-scoped) and a build that emits lib/ (the package 'files').
#   - Versioning model: bump the version in each package you want to release,
#     then push ONE tag (v*) — any package whose version is not yet on npm is
#     published; already-published versions are skipped (idempotent).
#   - New packages that bring native deps (esbuild/sharp/rollup platform
#     binaries) must extend the allowBuilds map in pnpm-workspace.yaml.
#
# OIDC trusted publishing on npmjs.com - for EACH package (one-time, after the
# first version of that package exists):
#   { "provider": "github", "owner": "gitawego", "repo": "dsh-plugins",
#     "workflow_filename": "release.yml" }

name: release.yml

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm (reads the root packageManager field)
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --parallel typecheck

      - name: Test
        run: pnpm -r --parallel test

      - name: Build
        run: pnpm -r build

      - name: Publish packages (globpackages, OIDC, skip if already on npm)
        run: |
          set -euo pipefail
          published_any=false
          for d in packages/*/; do
            [ -f "$d/package.json" ] || continue
            pkg="$(node -p "require('./$d/package.json').name")"
            ver="$(node -p "require('./$d/package.json').version")"
            existing="$(npm view "$pkg@$ver" version 2>/dev/null || true)"
            if [ "$existing" = "$ver" ]; then
              echo "::notice::$pkg@$ver already on npm - skipping"
              continue
            fi
            echo "Publishing $pkg@$ver"
            (cd "$d" && npm publish --provenance --access public)
            published_any=true
          done
          echo "published_any=$published_any" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists"
          else
            gh release create "$tag" --generate-notes
          fi
