name: Release

# Publishes @gitawego/dsh-vision to npm on tag push (v*) via OIDC TRUSTED
# PUBLISHING (no NPM_TOKEN — npm deprecated bypass-2FA granular access tokens
# for org/package management in early August 2026; see
# https://github.blog/changelog/2026-07-08-npm-install-time-security-and-gat-bypass2fa-deprecation/).
#
# One-time setup on npmjs.com (package Settings → Trusted publishing — after
# the FIRST version exists; publish v0.1.0 once interactively with 2FA to
# create the package):
#   { "provider": "github", "owner": "gitawego", "repo": "dsh-vision",
#     "workflow_filename": "release.yml" }
# Then every v* tag publishes automatically with provenance via the OIDC
# token (id-token: write) — no long-lived publish token.
#
# Idempotent: skips if the version is already on npm (safe to re-run).
# Gates on typecheck + tests + build before publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # GitHub Release on tag push
  id-token: write  # npm OIDC trusted publishing (provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Skip if already published
        id: check
        run: |
          set -u
          ver=$(node -p "require('./package.json').version")
          pkg=$(node -p "require('./package.json').name")
          existing=$(npm view "$pkg@$ver" version 2>/dev/null || true)
          if [ "$existing" = "$ver" ]; then
            echo "::notice::$pkg@$ver already on npm — skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $pkg@$ver"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # OIDC trusted publishing: no NODE_AUTH_TOKEN. npm exchanges the GitHub
      # OIDC token for a Sigstore certificate and the registry accepts the
      # publish because this repo+workflow is a registered trusted publisher.
      - name: Publish (OIDC trusted publishing)
        if: steps.check.outputs.skip != 'true'
        run: npm publish --provenance --access public

      # Keep GitHub Releases in sync with npm: create a release for the tag
      # (auto-generated notes). Idempotent — skips if the release already exists.
      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists — skipping"
          else
            gh release create "$tag" --generate-notes --title "$tag"
          fi

